[[bin]]
name = "likx"
path = "src/bin/likx.rs"
doc = false

[[bin]]
name = "liknon-validator"
path = "src/bin/liknon-validator.rs"
doc = false

[[bin]]
name = "likv"
path = "src/bin/likv.rs"
doc = false

[[bin]]
name = "liknon-manager"
path = "src/bin/liknon-manager.rs"
doc = false

[[bin]]
name = "likm"
path = "src/bin/likm.rs"
doc = false

[[bin]]
name = "liknon-tool"
path = "src/bin/liknon-tool.rs"
doc = false

[[bin]]
name = "likt"
path = "src/bin/likt.rs"
doc = false
