[package]
name = "liknon-cli"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Complete Liknon CLI suite with validation and resource tooling"
readme = "README.md"
keywords = ["validation", "cli", "workspace", "automation", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap.workspace = true
liknon-cli-ui.workspace = true
liknon-manager.workspace = true
liknon-tool.workspace = true
liknon-validator.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
console.workspace = true
liknon-resource-contracts = { workspace = true, features = ["signing"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bin]]
name = "liknon"
path = "src/bin/liknon.rs"
doc = false

[[bin]]
name = "liknon-validator"
path = "src/bin/liknon-validator.rs"
doc = false

[[bin]]
name = "liknon-manager"
path = "src/bin/liknon-manager.rs"
doc = false

[[bin]]
name = "liknon-tool"
path = "src/bin/liknon-tool.rs"
doc = false
