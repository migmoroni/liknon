[package]
name = "liknon-cli"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Aggregate package and unified launcher shell for the Liknon CLI suite"

[dependencies]
clap.workspace = true
liknon-cli-ui.workspace = true
liknon-manager.workspace = true
liknon-tool.workspace = true
liknon-validator.workspace = true

[dev-dependencies]
console.workspace = true

[[bin]]
name = "liknon"
path = "src/bin/liknon.rs"
