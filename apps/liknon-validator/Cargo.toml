[package]
name = "liknon-validator"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Declarative, shell-free validation CLI for heterogeneous workspaces"
readme = "README.md"
keywords = ["validation", "cli", "workspace", "automation", "ci"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap.workspace = true
console.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
liknon-cli-ui.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
jsonschema.workspace = true
tempfile.workspace = true

[[bin]]
name = "liknon-validator"
path = "src/bin/liknon-validator.rs"
doc = false

[[bin]]
name = "likv"
path = "src/bin/likv.rs"
doc = false
