name: Liknon

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liknon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  platforms:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Test all targets
        run: cargo test --workspace --all-targets --locked
      - name: Test Rustdoc examples
        run: cargo test --workspace --doc --locked

  quality:
    name: Formatting, Clippy, and Rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build warning-free Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
        run: cargo doc --workspace --no-deps --locked
      - name: Check authored knowledge
        run: cargo run -p liknon-knowledge-maintenance --locked -- --check
      - name: Test intentional outcome fixtures
        run: cargo test -p liknon-validator --test outcome_fixtures --locked -- --ignored

  msrv:
    name: Rust 1.87
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.87
        run: rustup toolchain install 1.87.0 --profile minimal --no-self-update
      - name: Install Windows target for Rust 1.87
        run: rustup target add --toolchain 1.87.0 x86_64-pc-windows-gnu
      - name: Check all targets
        run: cargo +1.87.0 check --workspace --all-targets --locked
      - name: Check Windows target with Rust 1.87
        run: cargo +1.87.0 check --workspace --all-targets --locked --target x86_64-pc-windows-gnu
      - name: Test all targets
        run: cargo +1.87.0 test --workspace --all-targets --locked
      - name: Test Rustdoc examples
        run: cargo +1.87.0 test --workspace --doc --locked

  security:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Install audit tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: Audit dependency lockfile
        run: cargo audit --file Cargo.lock
      - name: Check crate licenses and sources
        run: cargo deny --config deny.toml check bans licenses sources

  package:
    name: Package boundaries and local installs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: List application package contents
        run: |
          cargo package --list --locked -p liknon-validator
          cargo package --list --locked -p liknon-manager
          cargo package --list --locked -p liknon-tool
          cargo package --list --locked -p liknon-cli
      - name: Install and smoke-test local applications
        shell: bash
        run: |
          validator_root="$RUNNER_TEMP/liknon-validator-install"
          manager_root="$RUNNER_TEMP/liknon-manager-install"
          tool_root="$RUNNER_TEMP/liknon-tool-install"
          aggregate_root="$RUNNER_TEMP/liknon-cli-install"
          smoke_dir="$RUNNER_TEMP/liknon-smoke"

          cargo install --path apps/liknon-validator --root "$validator_root" --locked
          cargo install --path apps/liknon-manager --root "$manager_root" --locked
          cargo install --path apps/liknon-tool --root "$tool_root" --locked
          cargo install --path apps/liknon-cli --root "$aggregate_root" --locked

          "$validator_root/bin/liknon-validator" --version
          "$validator_root/bin/likv" --help > /dev/null
          "$manager_root/bin/liknon-manager" --version
          "$manager_root/bin/likm" --help > /dev/null
          "$tool_root/bin/liknon-tool" --version
          "$tool_root/bin/likt" --help > /dev/null
          "$aggregate_root/bin/liknon" --version
          "$aggregate_root/bin/likx" --help > /dev/null
          "$aggregate_root/bin/liknon-validator" --version
          "$aggregate_root/bin/likv" --version
          "$aggregate_root/bin/liknon-manager" --version
          "$aggregate_root/bin/likm" --version
          "$aggregate_root/bin/liknon-tool" --version
          "$aggregate_root/bin/likt" --version

          mkdir -p "$smoke_dir"
          cat > "$smoke_dir/config.json" <<'JSON'
          {
            "schemaVersion": 6,
            "workspaceRoot": ".",
            "defaultGroup": "all",
            "outputLimitBytes": 4096,
            "tools": [
              {
                "id": "rustc",
                "program": "rustc",
                "requiresTools": [],
                "versionArgs": ["--version"],
                "versionParser": "firstSemver",
                "versionRequirement": ">=1.87"
              }
            ],
            "checks": [
              {
                "id": "rust.version",
                "label": "Rust version",
                "description": "Reads the active Rust compiler version.",
                "toolId": "rustc",
                "args": ["--version"],
                "requiresTools": [],
                "timeoutSeconds": 30
              }
            ],
            "suites": [
              {
                "id": "rust",
                "label": "Rust",
                "description": "Validates the Rust compiler.",
                "checks": [
                  {
                    "checkId": "rust.version",
                    "dependsOn": []
                  }
                ]
              }
            ],
            "groups": [
              {
                "id": "all",
                "label": "All validations",
                "description": "Runs every validation.",
                "members": [
                  { "kind": "suite", "id": "rust" }
                ]
              }
            ]
          }
          JSON

          "$validator_root/bin/liknon-validator" schema config > /dev/null
          "$validator_root/bin/liknon-validator" schema report > /dev/null
          "$validator_root/bin/liknon-validator" config validate \
            --config "$smoke_dir/config.json"
