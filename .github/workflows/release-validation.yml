name: Release Validation CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed annotated liknon-validator-v<VERSION> tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PRODUCT_DESCRIPTOR: distribution/cli/validation/product.json
  RELEASE_TOOLCHAIN: 1.87.0
  RELEASE_ARTIFACT_PREFIX: validation
  IDENTITY_ARTIFACT: validation-release-contract

jobs:
  contract:
    name: Source contract and crates candidate
    runs-on: ubuntu-24.04
    outputs:
      native_matrix: ${{ steps.target-matrices.outputs.native_matrix }}
      public_matrix: ${{ steps.target-matrices.outputs.public_matrix }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify approved signed tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          distribution/cli/common/scripts/verify-release-tag.sh \
            "$RELEASE_TAG" distribution/cli/validation/direct

      - name: Install exact release toolchain
        shell: bash
        run: |
          rustup toolchain install "$RELEASE_TOOLCHAIN" \
            --profile minimal \
            --component rustfmt,clippy \
            --no-self-update

      - name: Derive and validate release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          descriptor_toolchain=$(jq -r '.product.releaseRustToolchain' "$PRODUCT_DESCRIPTOR")
          [ "$descriptor_toolchain" = "$RELEASE_TOOLCHAIN" ]
          cargo "+$RELEASE_TOOLCHAIN" run --quiet --locked -p liknon-cli-distribution -- \
            inspect \
            --descriptor "$PRODUCT_DESCRIPTOR" \
            --workspace . \
            --output "$RUNNER_TEMP/identity.json" \
            --release
          [ "$(jq -r '.tag' "$RUNNER_TEMP/identity.json")" = "$RELEASE_TAG" ]
          [ "$(jq -r '.commit' "$RUNNER_TEMP/identity.json")" = "$(git rev-parse HEAD)" ]

      - name: Derive target matrices from the product descriptor
        id: target-matrices
        shell: bash
        run: |
          native_matrix=$(jq -c '{include: [.targets[] | {
            target: .rustTarget,
            runner: .runner,
            suffix: .executableSuffix,
            authenticity: .authenticity
          }]}' "$PRODUCT_DESCRIPTOR")
          public_matrix=$(jq -c '{include: [.targets[] | {
            target: .rustTarget,
            runner: .runner,
            operating_system: .operatingSystem,
            shell_kind: (if .operatingSystem == "windows" then "powershell" else "posix" end),
            libc: (.libc // "")
          }]}' "$PRODUCT_DESCRIPTOR")
          printf 'native_matrix=%s\n' "$native_matrix" >> "$GITHUB_OUTPUT"
          printf 'public_matrix=%s\n' "$public_matrix" >> "$GITHUB_OUTPUT"

      - name: Run project release gates
        shell: bash
        run: |
          cargo "+$RELEASE_TOOLCHAIN" fmt --all -- --check
          cargo "+$RELEASE_TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings
          cargo "+$RELEASE_TOOLCHAIN" test --workspace --all-targets --locked
          cargo "+$RELEASE_TOOLCHAIN" test --workspace --doc --locked
          cargo "+$RELEASE_TOOLCHAIN" test -p liknon-validator \
            --test outcome_fixtures --locked -- --ignored

      - name: Inspect and exercise crates.io source candidate
        shell: bash
        run: |
          version=$(jq -r '.version' "$RUNNER_TEMP/identity.json")
          ui_version=$(cargo metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "liknon-cli-ui") | .version')
          [ -n "$ui_version" ] && [ "$ui_version" != null ]
          export LIKNON_SOURCE_REHEARSAL_ROOT="$RUNNER_TEMP/source-rehearsal"
          RUSTUP_TOOLCHAIN="$RELEASE_TOOLCHAIN" \
            distribution/cli/common/scripts/rehearse-source-packages.sh \
              liknon-cli-ui -- liknon-validator
          cargo "+$RELEASE_TOOLCHAIN" package --list --locked -p liknon-validator \
            > "$RUNNER_TEMP/package-inventory.txt"
          if rg '^(docs/validation|docs/plans|skills/|evals/|fixtures/|distribution/)' \
            "$RUNNER_TEMP/package-inventory.txt"; then
            printf '%s\n' "source package contains repository-only material" >&2
            exit 1
          fi
          package_dir="target/package/liknon-validator-$version"
          crate="target/package/liknon-validator-$version.crate"
          ui_crate="target/package/liknon-cli-ui-$ui_version.crate"
          [ -d "$package_dir" ]
          [ -f "$crate" ]
          [ -f "$ui_crate" ]
          cargo "+$RELEASE_TOOLCHAIN" install \
            --config 'source.crates-io.replace-with="liknon-rehearsal"' \
            --config "source.liknon-rehearsal.directory='$LIKNON_SOURCE_REHEARSAL_ROOT/vendor'" \
            --path "$package_dir" \
            --locked \
            --root "$RUNNER_TEMP/package-install"
          "$RUNNER_TEMP/package-install/bin/liknon-validator" --version
          "$RUNNER_TEMP/package-install/bin/likv" --version
          "$RUNNER_TEMP/package-install/bin/liknon-validator" schema config > /dev/null
          mkdir -p "$RUNNER_TEMP/contract"
          cp "$RUNNER_TEMP/identity.json" "$RUNNER_TEMP/contract/"
          cp "$RUNNER_TEMP/package-inventory.txt" "$RUNNER_TEMP/contract/"
          cp "$crate" "$RUNNER_TEMP/contract/"
          cp "$ui_crate" "$RUNNER_TEMP/contract/"
          openssl dgst -sha256 -r "$crate" > "$RUNNER_TEMP/contract/crate.sha256"
          openssl dgst -sha256 -r "$ui_crate" > "$RUNNER_TEMP/contract/ui-crate.sha256"
          jq -n \
            --arg package liknon-cli-ui \
            --arg version "$ui_version" \
            --arg sha256 "$(openssl dgst -sha256 -r "$ui_crate" | awk '{print $1}')" \
            '{schemaVersion: 1, packages: [{package: $package, version: $version, sha256: $sha256}]}' \
            > "$RUNNER_TEMP/contract/supporting-packages.json"

      - name: Verify release preparation leaves source unchanged
        shell: bash
        run: |
          git diff --exit-code
          [ -z "$(git status --short --untracked-files=all)" ] \
            || { git status --short --untracked-files=all >&2; exit 1; }

      - name: Upload inspected source contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  native:
    name: Native ${{ matrix.target }}
    needs: contract
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.native_matrix) }}
    uses: ./.github/workflows/_cli-native-candidate.yml
    with:
      descriptor: distribution/cli/validation/product.json
      release_ref: ${{ inputs.tag }}
      identity_artifact: validation-release-contract
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      toolchain: 1.87.0
      package: liknon-validator
      canonical_command: liknon-validator
      alias_command: likv
      executable_suffix: ${{ matrix.suffix }}
      authenticity: ${{ matrix.authenticity }}
      artifact_prefix: validation
    permissions:
      contents: read

  sign-windows:
    name: Sign Windows native candidate
    needs: native
    runs-on: windows-2025
    environment: sign-cli-windows
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download unsigned Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-native-unsigned-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/transport

      - name: Restore unsigned candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/native" | Out-Null
          $Archive = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/transport" -Filter *.tar | Select-Object -First 1
          if ($null -eq $Archive) { throw "Unsigned Windows transport is missing." }
          tar -xf $Archive.FullName -C "$env:RUNNER_TEMP/native"

      - name: Apply self-signed Authenticode and RFC 3161 timestamp
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_CERT_FINGERPRINT: ${{ vars.WINDOWS_CERT_FINGERPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_FINGERPRINT) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "AP-2 incomplete: Windows signing identity or metadata is missing."
          }
          $Pfx = Join-Path $env:RUNNER_TEMP "liknon-signing.pfx"
          [System.IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $Payload = Join-Path $env:RUNNER_TEMP "native/payloads/x86_64-pc-windows-msvc/liknon-validator.exe"
          $SignTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $SignTool) { throw "SignTool was not found." }
          & $SignTool.FullName sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /f $Pfx /p $env:WINDOWS_PFX_PASSWORD $Payload
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed." }
          $Signature = Get-AuthenticodeSignature -LiteralPath $Payload
          if ($Signature.Status -eq 'NotSigned' -or
              $Signature.Status -eq 'HashMismatch' -or
              $Signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERT_FINGERPRINT -or
              $null -eq $Signature.TimeStamperCertificate) {
            throw "Signed payload does not match the approved fingerprint and timestamp contract."
          }
          [ordered]@{
            mode = 'self-signed-authenticode'
            verified = $true
            method = 'SignTool SHA-256 with RFC 3161 timestamp; fingerprint pinned without trust-store import'
            certificateFingerprint = $Signature.SignerCertificate.Thumbprint
            timestamped = $true
          } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/authenticity.json" -Encoding utf8NoBOM

      - name: Install exact release toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RELEASE_TOOLCHAIN --profile minimal --no-self-update

      - name: Smoke-test and record signed payload
        shell: bash
        run: |
          payload="$RUNNER_TEMP/native/payloads/x86_64-pc-windows-msvc/liknon-validator.exe"
          cp "$payload" "$RUNNER_TEMP/likv.exe"
          "$payload" --version > "$RUNNER_TEMP/canonical-version.txt"
          "$RUNNER_TEMP/likv.exe" --version > "$RUNNER_TEMP/alias-version.txt"
          cmp "$RUNNER_TEMP/canonical-version.txt" "$RUNNER_TEMP/alias-version.txt"
          rm -f "$RUNNER_TEMP/likv.exe"
          mkdir -p "$RUNNER_TEMP/native/records"
          cargo "+$RELEASE_TOOLCHAIN" run --quiet --locked -p liknon-cli-distribution -- \
            native-record \
            --descriptor "$PRODUCT_DESCRIPTOR" \
            --target x86_64-pc-windows-msvc \
            --payload "$payload" \
            --payload-path x86_64-pc-windows-msvc/liknon-validator.exe \
            --authenticity "$RUNNER_TEMP/authenticity.json" \
            --output "$RUNNER_TEMP/native/records/x86_64-pc-windows-msvc.json"
          tar -cf "$RUNNER_TEMP/x86_64-pc-windows-msvc.tar" -C "$RUNNER_TEMP/native" .

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/liknon-signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload final Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-native-final-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/x86_64-pc-windows-msvc.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble-direct:
    name: Assemble direct candidate
    needs: [native, sign-windows]
    uses: ./.github/workflows/_cli-direct-assembly.yml
    with:
      descriptor: distribution/cli/validation/product.json
      release_ref: ${{ inputs.tag }}
      toolchain: 1.87.0
      artifact_prefix: validation
      identity_artifact: validation-release-contract
      download_base_url: ${{ vars.LIKNON_DOWNLOAD_BASE_URL }}
      public_key: distribution/cli/validation/direct/public-key.pem
    permissions:
      contents: read

  sign-direct:
    name: Sign direct metadata
    needs: assemble-direct
    runs-on: ubuntu-24.04
    environment: sign-cli-release
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download unsigned direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-unsigned
          path: ${{ runner.temp }}/transport

      - name: Download release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Install exact release toolchain
        shell: bash
        run: rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --no-self-update

      - name: Restore candidate and signing identity
        shell: bash
        env:
          DIRECT_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.DIRECT_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          [ -n "$DIRECT_SIGNING_PRIVATE_KEY_BASE64" ] \
            || { printf '%s\n' "AP-3 incomplete: detached-signature key is missing" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/direct"
          tar -xf "$RUNNER_TEMP/transport/direct-unsigned.tar" -C "$RUNNER_TEMP/direct"
          printf '%s' "$DIRECT_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private.pem"
          chmod 600 "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/derived-public.pem"
          cmp "$RUNNER_TEMP/derived-public.pem" distribution/cli/validation/direct/public-key.pem

      - name: Sign and verify exact direct bytes
        shell: bash
        run: |
          distribution/cli/common/scripts/sign-direct.sh \
            "$RUNNER_TEMP/direct" "$RUNNER_TEMP/private.pem"
          cargo "+$RELEASE_TOOLCHAIN" run --quiet --locked -p liknon-cli-distribution -- \
            verify-direct \
            --descriptor "$PRODUCT_DESCRIPTOR" \
            --identity "$RUNNER_TEMP/contract/identity.json" \
            --workspace . \
            --manifest "$RUNNER_TEMP/direct/manifest.json" \
            --root "$RUNNER_TEMP/direct" \
            --public-key distribution/cli/validation/direct/public-key.pem
          tar -cf "$RUNNER_TEMP/direct-signed.tar" -C "$RUNNER_TEMP/direct" .

      - name: Remove detached signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/derived-public.pem"

      - name: Upload signed direct candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/direct-signed.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-candidates:
    name: Verify retained candidates
    needs: sign-direct
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download signed direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/transport

      - name: Download release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Install exact release toolchain
        shell: bash
        run: rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --no-self-update

      - name: Authenticate complete direct candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/direct"
          tar -xf "$RUNNER_TEMP/transport/direct-signed.tar" -C "$RUNNER_TEMP/direct"
          cargo "+$RELEASE_TOOLCHAIN" run --quiet --locked -p liknon-cli-distribution -- \
            verify-direct \
            --descriptor "$PRODUCT_DESCRIPTOR" \
            --identity "$RUNNER_TEMP/contract/identity.json" \
            --workspace . \
            --manifest "$RUNNER_TEMP/direct/manifest.json" \
            --root "$RUNNER_TEMP/direct" \
            --public-key distribution/cli/validation/direct/public-key.pem

      - name: Exercise transactional installer against local origin
        shell: bash
        run: |
          version=$(jq -r '.version' "$RUNNER_TEMP/contract/identity.json")
          prefix=$(jq -r '.distribution.releasePrefix' "$PRODUCT_DESCRIPTOR")
          web_root="$RUNNER_TEMP/web"
          release_root="$web_root/$prefix/v$version"
          mkdir -p "$release_root"
          cp "$RUNNER_TEMP/direct"/* "$release_root/"
          python3 -m http.server 18080 --directory "$web_root" > "$RUNNER_TEMP/http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          sh "$RUNNER_TEMP/direct/install.sh" \
            --base-url http://127.0.0.1:18080 \
            --install-dir "$RUNNER_TEMP/install"
          "$RUNNER_TEMP/install/liknon-validator" --version
          "$RUNNER_TEMP/install/likv" --version
          "$RUNNER_TEMP/install/liknon-validator" -h > "$RUNNER_TEMP/canonical-help.txt"
          "$RUNNER_TEMP/install/likv" -h > "$RUNNER_TEMP/alias-help.txt"
          cmp "$RUNNER_TEMP/canonical-help.txt" "$RUNNER_TEMP/alias-help.txt"
          "$RUNNER_TEMP/install/liknon-validator" schema config > /dev/null
          before_canonical=$(openssl dgst -sha256 -r "$RUNNER_TEMP/install/liknon-validator" | awk '{print $1}')
          before_alias=$(openssl dgst -sha256 -r "$RUNNER_TEMP/install/likv" | awk '{print $1}')
          archive=$(jq -r '.artifacts[] | select(.target == "x86_64-unknown-linux-gnu") | .archive.path' "$RUNNER_TEMP/direct/manifest.json")
          printf 'mutation' >> "$release_root/$archive"
          if sh "$RUNNER_TEMP/direct/install.sh" \
            --base-url http://127.0.0.1:18080 \
            --install-dir "$RUNNER_TEMP/install"; then
            printf '%s\n' "mutated archive was accepted" >&2
            exit 1
          fi
          after_canonical=$(openssl dgst -sha256 -r "$RUNNER_TEMP/install/liknon-validator" | awk '{print $1}')
          after_alias=$(openssl dgst -sha256 -r "$RUNNER_TEMP/install/likv" | awk '{print $1}')
          [ "$before_canonical" = "$after_canonical" ]
          [ "$before_alias" = "$after_alias" ]
          sh "$RUNNER_TEMP/direct/install.sh" --install-dir "$RUNNER_TEMP/install" --uninstall

  verify-posix-platforms:
    name: Verify retained POSIX installer (${{ matrix.target }})
    needs: sign-direct
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download signed direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/transport

      - name: Exercise retained POSIX installer
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          direct="$RUNNER_TEMP/direct"
          web="$RUNNER_TEMP/web"
          install="$RUNNER_TEMP/install path"
          mkdir -p "$direct"
          tar -xf "$RUNNER_TEMP/transport/direct-signed.tar" -C "$direct"
          version=$(jq -r '.identity.version' "$direct/manifest.json")
          prefix=$(jq -r '.distribution.releasePrefix' "$PRODUCT_DESCRIPTOR")
          release="$web/$prefix/v$version"
          mkdir -p "$release"
          cp "$direct"/* "$release/"
          python3 -m http.server 18081 --bind 127.0.0.1 --directory "$web" \
            > "$RUNNER_TEMP/http-posix.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          output=$(sh "$direct/install.sh" \
            --base-url http://127.0.0.1:18081 \
            --install-dir "$install")
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "Selected target: $EXPECTED_TARGET" >/dev/null
          "$install/liknon-validator" --version
          "$install/likv" --version
          "$install/liknon-validator" -h > "$RUNNER_TEMP/canonical-help.txt"
          "$install/likv" -h > "$RUNNER_TEMP/alias-help.txt"
          cmp "$RUNNER_TEMP/canonical-help.txt" "$RUNNER_TEMP/alias-help.txt"
          "$install/liknon-validator" schema config > /dev/null
          sh "$direct/install.sh" --install-dir "$install" --uninstall
          [ ! -e "$install/liknon-validator" ]
          [ ! -e "$install/likv" ]

  verify-windows-platform:
    name: Verify retained PowerShell installer
    needs: sign-direct
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download signed direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/transport

      - name: Exercise retained PowerShell installer and rollback
        shell: pwsh
        run: |
          $Direct = Join-Path $env:RUNNER_TEMP "direct"
          $Web = Join-Path $env:RUNNER_TEMP "web"
          $Install = Join-Path $env:RUNNER_TEMP "install path"
          New-Item -ItemType Directory -Path $Direct | Out-Null
          tar -xf "$env:RUNNER_TEMP/transport/direct-signed.tar" -C $Direct
          $Manifest = Get-Content -LiteralPath (Join-Path $Direct "manifest.json") -Raw | ConvertFrom-Json
          $Descriptor = Get-Content -LiteralPath $env:PRODUCT_DESCRIPTOR -Raw | ConvertFrom-Json
          $Release = Join-Path $Web "$($Descriptor.distribution.releasePrefix)/v$($Manifest.identity.version)"
          New-Item -ItemType Directory -Path $Release -Force | Out-Null
          Copy-Item -Path (Join-Path $Direct "*") -Destination $Release
          $Server = Start-Process python -ArgumentList @(
            "-m", "http.server", "18082", "--bind", "127.0.0.1", "--directory", $Web
          ) -PassThru -WindowStyle Hidden
          try {
            $Ready = $false
            for ($Attempt = 0; $Attempt -lt 20; $Attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 `
                  -Uri "http://127.0.0.1:18082/$($Descriptor.distribution.releasePrefix)/v$($Manifest.identity.version)/manifest.json" `
                  -OutFile "$env:RUNNER_TEMP/probe.json"
                $Ready = $true
                break
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $Ready) { throw "Local candidate origin did not start." }
            $Installer = Join-Path $Direct "install.ps1"
            & $Installer -BaseUrl "http://127.0.0.1:18082" -InstallDir $Install
            $Canonical = Join-Path $Install "liknon-validator.exe"
            $Alias = Join-Path $Install "likv.exe"
            & $Canonical --version
            & $Alias --version
            $CanonicalHelp = (& $Canonical -h | Out-String)
            $AliasHelp = (& $Alias -h | Out-String)
            if ($CanonicalHelp -cne $AliasHelp) { throw "Installed aliases produced different help." }
            & $Canonical schema config | Out-Null
            $BeforeCanonical = (Get-FileHash -Algorithm SHA256 -LiteralPath $Canonical).Hash
            $BeforeAlias = (Get-FileHash -Algorithm SHA256 -LiteralPath $Alias).Hash
            $Archive = $Manifest.artifacts |
              Where-Object { $_.target -eq "x86_64-pc-windows-msvc" } |
              Select-Object -ExpandProperty archive
            Add-Content -LiteralPath (Join-Path $Release $Archive.path) -Value "mutation" -NoNewline
            $Rejected = $false
            try {
              & $Installer -BaseUrl "http://127.0.0.1:18082" -InstallDir $Install
            } catch { $Rejected = $true }
            if (-not $Rejected) { throw "Mutated Windows archive was accepted." }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Canonical).Hash -ne $BeforeCanonical -or
                (Get-FileHash -Algorithm SHA256 -LiteralPath $Alias).Hash -ne $BeforeAlias) {
              throw "Failed Windows update replaced an installed command."
            }
            & $Installer -InstallDir $Install -Uninstall
            if (Test-Path -LiteralPath $Canonical) { throw "Uninstall left canonical command." }
            if (Test-Path -LiteralPath $Alias) { throw "Uninstall left alias command." }
          } finally {
            Stop-Process -Id $Server.Id -Force -ErrorAction SilentlyContinue
          }

  attest:
    name: Attest retained release subjects
    needs: [verify-candidates, verify-posix-platforms, verify-windows-platform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download signed direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/direct-transport

      - name: Download crates candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Restore attestation subjects
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/subjects"
          tar -xf "$RUNNER_TEMP/direct-transport/direct-signed.tar" -C "$RUNNER_TEMP/subjects"
          cp "$RUNNER_TEMP"/contract/*.crate "$RUNNER_TEMP/subjects/"

      - name: Publish GitHub artifact attestations
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/subjects/*.crate
            ${{ runner.temp }}/subjects/*.tar.gz
            ${{ runner.temp }}/subjects/*.zip

  approval:
    name: Human release approval
    needs: attest
    runs-on: ubuntu-24.04
    environment: cli-release-approval
    permissions:
      contents: read
    steps:
      - name: Record credential-free approval gate
        run: printf '%s\n' "Approved retained candidates for ${{ inputs.tag }}"

  preflight-crates:
    name: Preflight crates.io publication
    needs: approval
    runs-on: ubuntu-24.04
    environment: publish-crates-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download inspected crates candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Probe crates.io trusted publishing
        id: crates-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Verify registry state and publication credential
        shell: bash
        env:
          TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates-auth.outputs.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(jq -r '.version' "$RUNNER_TEMP/contract/identity.json")
          candidate="$RUNNER_TEMP/contract/liknon-validator-$version.crate"
          [ -f "$candidate" ]
          ui_version=$(jq -r \
            '.packages[] | select(.package == "liknon-cli-ui") | .version' \
            "$RUNNER_TEMP/contract/supporting-packages.json")
          ui_candidate="$RUNNER_TEMP/contract/liknon-cli-ui-$ui_version.crate"
          [ -n "$ui_version" ] && [ "$ui_version" != null ] && [ -f "$ui_candidate" ]
          ui_status=$(curl --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/liknon-cli-ui-version.json" \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/liknon-cli-ui/$ui_version")
          [ "$ui_status" = 200 ] || {
            printf '%s\n' \
              "liknon-cli-ui $ui_version must be published before liknon-validator" >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/liknon-cli-ui-published.crate" \
            "https://crates.io/api/v1/crates/liknon-cli-ui/$ui_version/download"
          cmp "$ui_candidate" "$RUNNER_TEMP/liknon-cli-ui-published.crate" \
            || { printf '%s\n' "published liknon-cli-ui bytes differ from the retained dependency" >&2; exit 1; }
          status=$(curl --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/crates-version.json" \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/liknon-validator/$version")
          if [ "$status" = 200 ]; then
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/published.crate" \
              "https://crates.io/api/v1/crates/liknon-validator/$version/download"
            cmp "$candidate" "$RUNNER_TEMP/published.crate" \
              || { printf '%s\n' "crates.io version exists with different bytes" >&2; exit 1; }
          elif [ "$status" = 404 ]; then
            if [ -z "$TRUSTED_PUBLISHING_TOKEN" ] && [ -z "$BOOTSTRAP_TOKEN" ]; then
              printf '%s\n' \
                "AP-5 incomplete: neither crates.io trusted publishing nor a bootstrap token is available" >&2
              exit 1
            fi
          else
            printf '%s\n' "unexpected crates.io response: HTTP $status" >&2
            exit 1
          fi

  preflight-github:
    name: Preflight GitHub Release publication
    needs: approval
    runs-on: ubuntu-24.04
    environment: publish-github-cli
    permissions:
      contents: write
    steps:
      - name: Verify repository authority and release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push')" = true ] \
            || { printf '%s\n' "GitHub token cannot publish repository releases" >&2; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            [ "$(jq -r '.tag_name' "$RUNNER_TEMP/release.json")" = "$RELEASE_TAG" ]
            [ "$(jq '.assets | length' "$RUNNER_TEMP/release.json")" = 0 ] \
              || { printf '%s\n' "GitHub Release contains unexpected assets" >&2; exit 1; }
          fi

  preflight-cloudflare:
    name: Preflight Cloudflare publication
    needs: approval
    runs-on: ubuntu-24.04
    environment: publish-cloudflare-cli
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download signed direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/transport

      - name: Download release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Install pinned Cloudflare client
        shell: bash
        env:
          AWS_CLI_VERSION: ${{ vars.AWS_CLI_VERSION }}
          AWS_CLI_ZIP_SHA256: ${{ vars.AWS_CLI_ZIP_SHA256 }}
        run: |
          distribution/cli/common/scripts/install-aws-cli.sh \
            "$AWS_CLI_VERSION" "$AWS_CLI_ZIP_SHA256" "$RUNNER_TEMP/aws"
          printf '%s\n' "$RUNNER_TEMP/aws/bin" >> "$GITHUB_PATH"

      - name: Verify bucket authority and immutable object state
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          LIKNON_DOWNLOAD_BASE_URL: ${{ vars.LIKNON_DOWNLOAD_BASE_URL }}
          AWS_CLI_EXPECTED_VERSION: ${{ vars.AWS_CLI_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/direct"
          tar -xf "$RUNNER_TEMP/transport/direct-signed.tar" -C "$RUNNER_TEMP/direct"
          distribution/cli/common/scripts/preflight-r2.sh \
            "$PRODUCT_DESCRIPTOR" \
            "$RUNNER_TEMP/contract/identity.json" \
            "$RUNNER_TEMP/direct"

  publish-crates:
    name: Publish crates.io source package
    needs: [preflight-crates, preflight-github, preflight-cloudflare]
    runs-on: ubuntu-24.04
    environment: publish-crates-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download inspected crates candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Install exact release toolchain
        shell: bash
        run: rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --no-self-update

      - name: Authenticate with crates.io trusted publishing
        id: crates-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish or verify immutable crates.io version
        shell: bash
        env:
          TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates-auth.outputs.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(jq -r '.version' "$RUNNER_TEMP/contract/identity.json")
          candidate="$RUNNER_TEMP/contract/liknon-validator-$version.crate"
          [ -f "$candidate" ]
          cargo "+$RELEASE_TOOLCHAIN" package --locked -p liknon-validator
          cmp "$candidate" "target/package/liknon-validator-$version.crate" \
            || { printf '%s\n' "publication checkout does not reproduce the retained crate" >&2; exit 1; }
          status=$(curl --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/crates-version.json" \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/liknon-validator/$version")
          if [ "$status" = 200 ]; then
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/published.crate" \
              "https://crates.io/api/v1/crates/liknon-validator/$version/download"
            cmp "$candidate" "$RUNNER_TEMP/published.crate" \
              || { printf '%s\n' "crates.io version exists with different bytes" >&2; exit 1; }
          elif [ "$status" = 404 ]; then
            if [ -n "$TRUSTED_PUBLISHING_TOKEN" ]; then
              CARGO_REGISTRY_TOKEN=$TRUSTED_PUBLISHING_TOKEN
            elif [ -n "$BOOTSTRAP_TOKEN" ]; then
              CARGO_REGISTRY_TOKEN=$BOOTSTRAP_TOKEN
            else
              printf '%s\n' \
                "AP-5 incomplete: neither crates.io trusted publishing nor a bootstrap token is available" >&2
              exit 1
            fi
            export CARGO_REGISTRY_TOKEN
            cargo "+$RELEASE_TOOLCHAIN" publish --locked -p liknon-validator
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --output "$RUNNER_TEMP/published.crate" \
                "https://crates.io/api/v1/crates/liknon-validator/$version/download"; then
                break
              fi
              sleep 10
            done
            cmp "$candidate" "$RUNNER_TEMP/published.crate"
          else
            printf '%s\n' "unexpected crates.io response: HTTP $status" >&2
            exit 1
          fi

  publish-github:
    name: Publish metadata-only GitHub Release
    needs: publish-crates
    runs-on: ubuntu-24.04
    environment: publish-github-cli
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Create or verify metadata-only release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Source release for \`$RELEASE_TAG\`.

          This GitHub Release intentionally contains no binary assets. Native
          archives are distributed through the authenticated Liknon download
          domain described in the installation documentation.
          EOF
          distribution/cli/common/scripts/publish-github-release.sh \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

  publish-cloudflare:
    name: Publish immutable Cloudflare release
    needs: publish-github
    runs-on: ubuntu-24.04
    environment: publish-cloudflare-cli
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download signed direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/transport

      - name: Download release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Install pinned Cloudflare upload client
        shell: bash
        env:
          AWS_CLI_VERSION: ${{ vars.AWS_CLI_VERSION }}
          AWS_CLI_ZIP_SHA256: ${{ vars.AWS_CLI_ZIP_SHA256 }}
        run: |
          distribution/cli/common/scripts/install-aws-cli.sh \
            "$AWS_CLI_VERSION" "$AWS_CLI_ZIP_SHA256" "$RUNNER_TEMP/aws"
          printf '%s\n' "$RUNNER_TEMP/aws/bin" >> "$GITHUB_PATH"

      - name: Publish and read back immutable objects
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          LIKNON_DOWNLOAD_BASE_URL: ${{ vars.LIKNON_DOWNLOAD_BASE_URL }}
          AWS_CLI_EXPECTED_VERSION: ${{ vars.AWS_CLI_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/direct"
          tar -xf "$RUNNER_TEMP/transport/direct-signed.tar" -C "$RUNNER_TEMP/direct"
          distribution/cli/common/scripts/publish-r2.sh \
            "$PRODUCT_DESCRIPTOR" \
            "$RUNNER_TEMP/contract/identity.json" \
            "$RUNNER_TEMP/direct" \
            "$RUNNER_TEMP/r2-publication-state.json"

      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-publication-evidence
          path: ${{ runner.temp }}/r2-publication-state.json
          if-no-files-found: error
          retention-days: 90

  verify-public:
    name: Verify public channels
    needs: [contract, publish-cloudflare]
    uses: ./.github/workflows/_cli-public-verification.yml
    with:
      descriptor: distribution/cli/validation/product.json
      toolchain: 1.87.0
      identity_artifact: validation-release-contract
      release_ref: ${{ inputs.tag }}
      download_base_url: ${{ vars.LIKNON_DOWNLOAD_BASE_URL }}
      public_key: distribution/cli/validation/direct/public-key.pem
      windows_certificate_fingerprint: ${{ vars.WINDOWS_CERT_FINGERPRINT }}
      posix_smoke: distribution/cli/validation/smoke/verify.sh
      powershell_smoke: distribution/cli/validation/smoke/verify.ps1
      evidence_artifact: validation-public-verification-evidence
      target_matrix: ${{ needs.contract.outputs.public_matrix }}
    permissions:
      contents: read

  publish-stable:
    name: Advance verified stable pointer
    needs: verify-public
    runs-on: ubuntu-24.04
    environment: publish-cloudflare-cli
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download signed direct candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-direct-signed
          path: ${{ runner.temp }}/transport

      - name: Download release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-contract
          path: ${{ runner.temp }}/contract

      - name: Install exact release toolchain
        shell: bash
        run: rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install pinned Cloudflare upload client
        shell: bash
        env:
          AWS_CLI_VERSION: ${{ vars.AWS_CLI_VERSION }}
          AWS_CLI_ZIP_SHA256: ${{ vars.AWS_CLI_ZIP_SHA256 }}
        run: |
          distribution/cli/common/scripts/install-aws-cli.sh \
            "$AWS_CLI_VERSION" "$AWS_CLI_ZIP_SHA256" "$RUNNER_TEMP/aws"
          printf '%s\n' "$RUNNER_TEMP/aws/bin" >> "$GITHUB_PATH"

      - name: Generate and publish stable pointer
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          LIKNON_DOWNLOAD_BASE_URL: ${{ vars.LIKNON_DOWNLOAD_BASE_URL }}
          AWS_CLI_EXPECTED_VERSION: ${{ vars.AWS_CLI_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/direct"
          tar -xf "$RUNNER_TEMP/transport/direct-signed.tar" -C "$RUNNER_TEMP/direct"
          cargo "+$RELEASE_TOOLCHAIN" run --quiet --locked -p liknon-cli-distribution -- \
            stable-pointer \
            --descriptor "$PRODUCT_DESCRIPTOR" \
            --identity "$RUNNER_TEMP/contract/identity.json" \
            --workspace . \
            --manifest "$RUNNER_TEMP/direct/manifest.json" \
            --output "$RUNNER_TEMP/stable.json"
          distribution/cli/common/scripts/publish-stable.sh \
            "$PRODUCT_DESCRIPTOR" "$RUNNER_TEMP/stable.json" "$RUNNER_TEMP/stable-readback.json"
          cmp "$RUNNER_TEMP/stable.json" "$RUNNER_TEMP/stable-readback.json"
          stable_path=$(jq -r '.distribution.stablePointer' "$PRODUCT_DESCRIPTOR")
          stable_headers=$(curl --fail --silent --show-error --head --max-redirs 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "${LIKNON_DOWNLOAD_BASE_URL%/}/$stable_path?readback=${GITHUB_RUN_ID:-local}")
          printf '%s' "$stable_headers" | tr -d '\r' \
            | grep -i '^content-type: *application/json' >/dev/null
          printf '%s' "$stable_headers" | tr -d '\r' \
            | grep -i '^cache-control:.*max-age=60.*must-revalidate' >/dev/null
          version=$(jq -r '.version' "$RUNNER_TEMP/stable-readback.json")
          prefix=$(jq -r '.distribution.releasePrefix' "$PRODUCT_DESCRIPTOR")
          [ "$(jq -r '.manifestPath' "$RUNNER_TEMP/stable-readback.json")" = "$prefix/v$version/manifest.json" ]
          distribution/cli/common/scripts/fetch-public-direct.sh \
            "$LIKNON_DOWNLOAD_BASE_URL" "$prefix" "$version" \
            "$RUNNER_TEMP/stable-public" distribution/cli/validation/direct/public-key.pem
          expected_manifest_sha=$(jq -r '.manifestSha256' "$RUNNER_TEMP/stable-readback.json")
          actual_manifest_sha=$(openssl dgst -sha256 -r "$RUNNER_TEMP/stable-public/manifest.json" | awk '{print $1}')
          [ "$actual_manifest_sha" = "$expected_manifest_sha" ]
          cargo "+$RELEASE_TOOLCHAIN" run --quiet --locked -p liknon-cli-distribution -- \
            verify-direct \
            --descriptor "$PRODUCT_DESCRIPTOR" \
            --identity "$RUNNER_TEMP/contract/identity.json" \
            --workspace . \
            --manifest "$RUNNER_TEMP/stable-public/manifest.json" \
            --root "$RUNNER_TEMP/stable-public" \
            --public-key distribution/cli/validation/direct/public-key.pem

      - name: Retain stable-pointer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-stable-evidence
          path: |
            ${{ runner.temp }}/stable.json
            ${{ runner.temp }}/stable-readback.json
          if-no-files-found: error
          retention-days: 90
