name: Reusable CLI public verification

on:
  workflow_call:
    inputs:
      descriptor:
        required: true
        type: string
      toolchain:
        required: true
        type: string
      identity_artifact:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      download_base_url:
        required: true
        type: string
      public_key:
        required: true
        type: string
      windows_certificate_fingerprint:
        required: true
        type: string
      target_matrix:
        required: true
        type: string
      evidence_artifact:
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata-and-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install exact release toolchain
        shell: bash
        env:
          RELEASE_TOOLCHAIN: ${{ inputs.toolchain }}
        run: rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --no-self-update

      - name: Download inspected identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.identity_artifact }}
          path: ${{ runner.temp }}/contract

      - name: Verify metadata-only GitHub Release
        shell: bash
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          repository=$(jq -r '.product.repository' "$DESCRIPTOR")
          gh api "repos/$repository/releases/tags/$RELEASE_REF" \
            > "$RUNNER_TEMP/github-release.json"
          [ "$(jq -r '.tag_name' "$RUNNER_TEMP/github-release.json")" = "$RELEASE_REF" ]
          [ "$(jq '.assets | length' "$RUNNER_TEMP/github-release.json")" = 0 ] \
            || { printf '%s\n' "GitHub Release contains unexpected binary assets" >&2; exit 1; }

      - name: Fetch and authenticate all public suite objects
        shell: bash
        env:
          RELEASE_TOOLCHAIN: ${{ inputs.toolchain }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          version=$(jq -r '.version' "$RUNNER_TEMP/contract/identity.json")
          prefix=$(jq -r '.distribution.releasePrefix' "$DESCRIPTOR")
          distribution/cli/common/scripts/fetch-public-direct.sh \
            "$DOWNLOAD_BASE_URL" "$prefix" "$version" "$RUNNER_TEMP/public" "$PUBLIC_KEY"
          cargo "+$RELEASE_TOOLCHAIN" run --quiet --locked -p liknon-cli-distribution -- \
            verify-direct \
            --descriptor "$DESCRIPTOR" \
            --identity "$RUNNER_TEMP/contract/identity.json" \
            --workspace . \
            --manifest "$RUNNER_TEMP/public/manifest.json" \
            --root "$RUNNER_TEMP/public" \
            --public-key "$PUBLIC_KEY"

      - name: Install and verify exact crates.io suite
        shell: bash
        env:
          RELEASE_TOOLCHAIN: ${{ inputs.toolchain }}
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: |
          version=$(jq -r '.version' "$RUNNER_TEMP/contract/identity.json")
          package=$(jq -r '.product.cargoPackage' "$DESCRIPTOR")
          cargo "+$RELEASE_TOOLCHAIN" install "$package" \
            --version "=$version" --locked --root "$RUNNER_TEMP/crates-install"
          while IFS= read -r command_name; do
            [ -x "$RUNNER_TEMP/crates-install/bin/$command_name" ]
            "$RUNNER_TEMP/crates-install/bin/$command_name" --version
            "$RUNNER_TEMP/crates-install/bin/$command_name" -h > /dev/null
          done < <(jq -r '.product.commands[]' "$DESCRIPTOR")
          for rejected in likx likv likm likt; do
            [ ! -e "$RUNNER_TEMP/crates-install/bin/$rejected" ]
          done
          "$RUNNER_TEMP/crates-install/bin/liknon" validator --version
          "$RUNNER_TEMP/crates-install/bin/liknon" v --version
          "$RUNNER_TEMP/crates-install/bin/liknon" manager --version
          "$RUNNER_TEMP/crates-install/bin/liknon" m --version
          "$RUNNER_TEMP/crates-install/bin/liknon" tool --version
          "$RUNNER_TEMP/crates-install/bin/liknon" t --version

      - name: Install and verify exact GitHub source tag
        shell: bash
        env:
          RELEASE_TOOLCHAIN: ${{ inputs.toolchain }}
          RELEASE_REF: ${{ inputs.release_ref }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          repository=$(jq -r '.product.repository' "$DESCRIPTOR")
          manifest=$(jq -r '.product.cargoManifest' "$DESCRIPTOR")
          package_dir=$(dirname "$manifest")
          git clone --branch "$RELEASE_REF" --depth 1 \
            "https://github.com/$repository.git" "$RUNNER_TEMP/source"
          (
            cd "$RUNNER_TEMP/source"
            distribution/cli/common/scripts/verify-release-tag.sh \
              "$RELEASE_REF" "$(dirname "$PUBLIC_KEY")"
          )
          cargo "+$RELEASE_TOOLCHAIN" install \
            --path "$RUNNER_TEMP/source/$package_dir" \
            --locked --root "$RUNNER_TEMP/source-install"
          while IFS= read -r command_name; do
            "$RUNNER_TEMP/source-install/bin/$command_name" --version
          done < <(jq -r '.product.commands[]' "$DESCRIPTOR")

      - name: Retain public readback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.evidence_artifact }}
          path: |
            ${{ runner.temp }}/github-release.json
            ${{ runner.temp }}/public/manifest.json
            ${{ runner.temp }}/public/manifest.sig
          if-no-files-found: error
          retention-days: 90

  direct-install:
    name: Direct suite install (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.target_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout verification material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Download and authenticate POSIX installer
        if: matrix.shell_kind == 'posix'
        shell: bash
        env:
          DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          tag_prefix=$(jq -r '.product.tagPrefix' "$DESCRIPTOR")
          case "$RELEASE_REF" in
            "$tag_prefix"*) version=${RELEASE_REF#"$tag_prefix"} ;;
            *) printf '%s\n' "release ref does not match suite tag prefix" >&2; exit 1 ;;
          esac
          prefix=$(jq -r '.distribution.releasePrefix' "$DESCRIPTOR")
          release_url="${DOWNLOAD_BASE_URL%/}/$prefix/v$version"
          curl --fail --silent --show-error --max-redirs 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/install.sh" "$release_url/install.sh"
          curl --fail --silent --show-error --max-redirs 0 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/install.sh.sig" "$release_url/install.sh.sig"
          openssl dgst -sha256 -verify "$PUBLIC_KEY" \
            -signature "$RUNNER_TEMP/install.sh.sig" "$RUNNER_TEMP/install.sh"

      - name: Prepare MUSL runtime probe
        if: matrix.shell_kind == 'posix' && matrix.libc == 'musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl
          (ldd --version 2>&1 || true) | grep -qi musl \
            || find /lib /usr/lib -maxdepth 2 -name 'ld-musl-*.so.1' -print -quit | grep -q .

      - name: Execute and verify POSIX suite installer
        if: matrix.shell_kind == 'posix'
        shell: bash
        env:
          DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          EXPECTED_LIBC: ${{ matrix.libc }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -- --base-url "$DOWNLOAD_BASE_URL" --install-dir "$RUNNER_TEMP/install"
          if [ -n "$EXPECTED_LIBC" ]; then set -- "$@" --libc "$EXPECTED_LIBC"; fi
          output=$(sh "$RUNNER_TEMP/install.sh" "$@")
          printf '%s\n' "$output" | grep -F "Selected target: $EXPECTED_TARGET" >/dev/null
          while IFS= read -r command_name; do
            "$RUNNER_TEMP/install/$command_name" --version
            "$RUNNER_TEMP/install/$command_name" -h > /dev/null
            if [ "${{ matrix.operating_system }}" = macos ]; then
              codesign --verify --strict --verbose=2 "$RUNNER_TEMP/install/$command_name"
            fi
          done < <(jq -r '.product.commands[]' "$DESCRIPTOR")
          "$RUNNER_TEMP/install/liknon" validator --version
          "$RUNNER_TEMP/install/liknon" manager --version
          "$RUNNER_TEMP/install/liknon" tool --version
          sh "$RUNNER_TEMP/install.sh" "$@"
          sh "$RUNNER_TEMP/install.sh" --install-dir "$RUNNER_TEMP/install" --uninstall
          while IFS= read -r command_name; do
            [ ! -e "$RUNNER_TEMP/install/$command_name" ]
          done < <(jq -r '.product.commands[]' "$DESCRIPTOR")

      - name: Download, authenticate, and execute PowerShell suite installer
        if: matrix.shell_kind == 'powershell'
        shell: pwsh
        env:
          DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          EXPECTED_FINGERPRINT: ${{ inputs.windows_certificate_fingerprint }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          $Descriptor = Get-Content -LiteralPath $env:DESCRIPTOR -Raw | ConvertFrom-Json
          if (-not $env:RELEASE_REF.StartsWith($Descriptor.product.tagPrefix, [System.StringComparison]::Ordinal)) {
            throw "Release ref does not match suite tag prefix."
          }
          $Version = $env:RELEASE_REF.Substring($Descriptor.product.tagPrefix.Length)
          $Target = $Descriptor.targets | Where-Object { $_.rustTarget -ceq $env:EXPECTED_TARGET }
          if ($null -eq $Target) { throw "Expected target is absent from the suite descriptor." }
          $ReleaseUrl = "$($env:DOWNLOAD_BASE_URL.TrimEnd('/'))/$($Descriptor.distribution.releasePrefix)/v$Version"
          $Installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          $Signature = Join-Path $env:RUNNER_TEMP "install.ps1.sig"
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri "$ReleaseUrl/install.ps1" -OutFile $Installer
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri "$ReleaseUrl/install.ps1.sig" -OutFile $Signature
          $Rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $Rsa.ImportFromPem((Get-Content -LiteralPath $env:PUBLIC_KEY -Raw))
            $Verified = $Rsa.VerifyData(
              [System.IO.File]::ReadAllBytes($Installer),
              [System.IO.File]::ReadAllBytes($Signature),
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
          } finally { $Rsa.Dispose() }
          if (-not $Verified) { throw "Installer signature verification failed." }
          $InstallDir = Join-Path $env:RUNNER_TEMP "install"
          & $Installer -BaseUrl $env:DOWNLOAD_BASE_URL -InstallDir $InstallDir
          foreach ($Command in $Descriptor.product.commands) {
            $Path = Join-Path $InstallDir "$Command$($Target.executableSuffix)"
            & $Path --version
            $SignatureState = Get-AuthenticodeSignature -LiteralPath $Path
            if ($SignatureState.SignerCertificate.Thumbprint -ne $env:EXPECTED_FINGERPRINT -or
                $null -eq $SignatureState.TimeStamperCertificate) {
              throw "Windows signing evidence does not match $Command."
            }
          }
          & (Join-Path $InstallDir "liknon.exe") validator --version
          & (Join-Path $InstallDir "liknon.exe") manager --version
          & (Join-Path $InstallDir "liknon.exe") tool --version
          & $Installer -BaseUrl $env:DOWNLOAD_BASE_URL -InstallDir $InstallDir
          & $Installer -InstallDir $InstallDir -Uninstall
          foreach ($Command in $Descriptor.product.commands) {
            if (Test-Path -LiteralPath (Join-Path $InstallDir "$Command$($Target.executableSuffix)")) {
              throw "Uninstall left $Command."
            }
          }
